# The defaults (1 worker × 512 connections, a new upstream connection per request) cap the proxy at
# ~250 concurrent clients: above that nginx drops connections and k6 reports EOF, which measures nginx,
# not Fleans. Sized for the 2 000-VU linear-saturation profile.
worker_processes auto;
events { worker_connections 16384; }

http {
    resolver 127.0.0.11 valid=5s;

    upstream fleans_api {
        server fleans-core:8080;
        keepalive 512;
    }

    server {
        listen 80;
        keepalive_requests 100000;

        location / {
            proxy_pass         http://fleans_api;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            # Required by verify-cluster.sh Stage 3 to confirm all replicas receive traffic
            add_header         X-Upstream-Host   $upstream_addr;
        }
    }
}
