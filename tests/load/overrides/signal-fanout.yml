# signal-fanout (#976, #1011): a projector leaves the worker 10 s after its instance stops advancing
# (Fleans:Projector:IdleDeactivation), so parking 100 000 instances keeps the default 512 MB worker
# at ~380 MB. The burst after the broadcast is what needs room: up to ~1.25 GB at 100 000, and the
# 512 MB worker runs out of memory there. Give the worker 2 GB so the scenario measures delivery and
# linear-10, not worker memory.
#
#   docker compose -f docker-compose.yml -f overrides/signal-fanout.yml up -d --wait
services:
  fleans-worker:
    deploy: { replicas: 1, resources: { limits: { memory: 2G } } }
