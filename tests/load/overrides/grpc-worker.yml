# gRPC external workers (#979): the `e2e-probe` task of load-one-task goes to external workers
# instead of the plugin host. The test worker (src/Fleans/Fleans.E2E.ExternalWorker, built on
# Fleans.ExternalTasks.Sdk) subscribes to fleans-api over gRPC, receives each task on its stream
# and reports the outcome with one unary call.
#
#   docker compose -f docker-compose.yml -f overrides/grpc-worker.yml up -d --wait
#   RATES="150 200" PROCESS=load-one-task bash scripts/throughput-ceiling.sh
#
# The fixture's `delayMs` input (50 ms) is the worker's work time, as with the plugin.

services:
  fleans-core:
    environment:
      Fleans__ExternalTasks__TaskTypes__0: e2e-probe

  # Nothing routes to the plugin any more.
  fleans-plugin:
    deploy: { replicas: 0 }

  external-worker:
    image: fleans-external-worker:loadtest
    environment:
      # Straight to the API container (plain HTTP/2 needs no TLS; gRPC-Web is the SDK default and
      # also works through nginx).
      Fleans__ExternalTaskWorker__EngineUrl: "http://fleans-api:8080"
      Fleans__ExternalTaskWorker__MaxConcurrentTasks: "256"
      Probe__TaskType: e2e-probe
    cpu_shares: 512
    deploy: { replicas: 2, resources: { limits: { memory: 256M } } }
    restart: on-failure
    depends_on:
      fleans-core: { condition: service_healthy }
      fleans-api: { condition: service_started }
