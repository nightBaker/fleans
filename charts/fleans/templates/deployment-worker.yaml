{{- if .Values.worker.enabled }}
{{- /*
No Service by design: worker silos host [StatelessWorker] grains called
in-process or via Orleans clustering (Redis + pod IPs). Nothing outside
the cluster targets the worker, so no inbound HTTP Service is needed.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleans.siloDeploymentName" (dict "ctx" . "role" "worker" "suffix" "") }}
  labels:
    {{- include "fleans.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not (.Values.worker.autoscaling | default dict).enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fleans.selectorLabels" (dict "ctx" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleans.selectorLabels" (dict "ctx" . "component" "worker") | nindent 8 }}
        {{- include "fleans.siloPodLabels" . | nindent 8 }}
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "fleans.siloPodSpec" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fleans-worker
          image: {{ include "fleans.imageRef" (dict "ctx" . "repo" .Values.image.api.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Fleans__Role
              value: "Worker"
            {{- include "fleans.siloEnv" . | nindent 12 }}
            {{- include "fleans.commonEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- with include "fleans.kafkaTlsVolumeMounts" . }}
          {{- . | nindent 10 }}
          {{- end }}
      {{- with include "fleans.kafkaTlsVolumes" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
