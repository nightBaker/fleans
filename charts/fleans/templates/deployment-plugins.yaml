{{- if .Values.plugins.enabled }}
{{- /*
Plugin host: ghcr.io/nightbaker/fleans-plugins, a Plugin-role silo with every ready-made
custom-task plugin. No Service: the engine reaches its grains through Orleans; expose the
Camunda /engine-rest API yourself if workers outside the cluster need it. Named
"plugin-<fullname>" so that with Kubernetes hosting the pod name (= silo name) starts with
the role.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleans.siloDeploymentName" (dict "ctx" . "role" "plugin" "suffix" "") }}
  labels:
    {{- include "fleans.labels" . | nindent 4 }}
    app.kubernetes.io/component: plugins
spec:
  replicas: {{ .Values.plugins.replicas }}
  selector:
    matchLabels:
      {{- include "fleans.selectorLabels" (dict "ctx" . "component" "plugins") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleans.selectorLabels" (dict "ctx" . "component" "plugins") | nindent 8 }}
        {{- include "fleans.siloPodLabels" . | nindent 8 }}
      {{- with .Values.plugins.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "fleans.siloPodSpec" . | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: fleans-plugins
          image: {{ printf "%s:%s" .Values.plugins.image.repository (default (include "fleans.imageTag" .) .Values.plugins.image.tag) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: Fleans__Role
              value: "Plugin"
            {{- include "fleans.siloEnv" . | nindent 12 }}
            {{- include "fleans.commonEnv" (dict "ctx" . "workload" "plugins") | nindent 12 }}
            {{- $camundaSet := false }}
            {{- range .Values.plugins.env }}
            {{- if eq .name "ConnectionStrings__camunda-external-tasks" }}{{ $camundaSet = true }}{{ end }}
            {{- end }}
            {{- if and .Values.postgres.enabled (not $camundaSet) }}
            - name: FLEANS_CAMUNDA_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ include "fleans.postgres.secretName" . }}
                  key: camunda-connection-string
            - name: ConnectionStrings__camunda-external-tasks
              value: "$(FLEANS_CAMUNDA_CONNECTION);Maximum Pool Size={{ include "fleans.maxPoolSize" (dict "ctx" . "workload" "plugins") }}"
            {{- end }}
            {{- with .Values.plugins.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.plugins.resources | nindent 12 }}
          {{- with include "fleans.kafkaTlsVolumeMounts" . }}
          {{- . | nindent 10 }}
          {{- end }}
      {{- with include "fleans.kafkaTlsVolumes" . }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- with .Values.plugins.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plugins.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plugins.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
