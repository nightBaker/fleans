# Default values for the fleans Helm chart.
# Override on the helm install command line via --set or -f my-values.yaml.

# -----------------------------------------------------------------------------
# Container images
# -----------------------------------------------------------------------------
# `Fleans.Worker` is a library hosted by `Fleans.Api`; both the silo (Core role)
# and worker silos (Worker role) run the same `fleans-api` image with a
# different Fleans__Role env var. There is no separate `fleans-worker` image.
image:
  pullPolicy: IfNotPresent
  # Tag defaults to the chart's appVersion when left empty.
  tag: ""
  api:
    repository: ghcr.io/nightbaker/fleans-api
  web:
    repository: ghcr.io/nightbaker/fleans-web
  mcp:
    repository: ghcr.io/nightbaker/fleans-mcp

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Workloads
# -----------------------------------------------------------------------------
# Orleans Core silo (hosts coordinator grains: WorkflowInstance etc.).
core:
  replicas: 1
  # HorizontalPodAutoscaler on CPU (templates/hpa.yaml). When enabled, `replicas` is ignored.
  # Utilization is relative to resources.requests.cpu — set the request to the CPU one silo really
  # uses (the load tests put a busy Core silo at 1–1.5 cores), or 250m × 65 % scales out at 0.16 cores.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
    scaleDownStabilizationSeconds: 300
    # KEDA instead of a plain HPA: the CPU target above plus Prometheus triggers on Fleans' scale
    # metrics (README "Autoscaling on Fleans metrics"). Needs KEDA and a Prometheus that scrapes the
    # silos' OTLP metrics.
    keda:
      enabled: false
      serverAddress: ""            # e.g. http://prometheus-server.monitoring.svc
      prometheus: []               # [{ name, query, threshold, serverAddress? }]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  service:
    type: ClusterIP
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# REST-only API (Fleans:Role=Api): the fleans-api image as an Orleans client with no grains,
# behind its own Service (<fullname>-api), so REST ingress scales apart from the silos.
# Disabled by default — the core silo serves the REST API too. When enabled, point REST
# clients at <fullname>-api; the core Service keeps answering as well.
api:
  enabled: false
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Orleans Worker silo (hosts [StatelessWorker] grains: ScriptExecutorGrain etc.).
# Disabled by default — Combined silos host worker grains too. Enable to run
# worker silos on dedicated nodes (e.g. cheaper / spot instances).
worker:
  enabled: false
  replicas: 1
  # HorizontalPodAutoscaler on CPU (templates/hpa.yaml). When enabled, `replicas` is ignored.
  # Utilization is relative to resources.requests.cpu — set the request to the CPU one silo really
  # uses (the load tests put a busy Core silo at 1–1.5 cores), or 250m × 65 % scales out at 0.16 cores.
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 65
    scaleDownStabilizationSeconds: 300
    # KEDA instead of a plain HPA: the CPU target above plus Prometheus triggers on Fleans' scale
    # metrics (README "Autoscaling on Fleans metrics"). Needs KEDA and a Prometheus that scrapes the
    # silos' OTLP metrics.
    keda:
      enabled: false
      serverAddress: ""            # e.g. http://prometheus-server.monitoring.svc
      prometheus: []               # [{ name, query, threshold, serverAddress? }]
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Plugin host: ghcr.io/nightbaker/fleans-plugins (github.com/nightBaker/fleans-plugins) — every
# ready-made custom-task plugin (REST Caller, Camunda 7 external tasks) in one Plugin-role silo.
# It joins with the engine's clustering / reminders / streaming providers (the same env as the
# engine silos). The tag defaults to the chart's appVersion: plugins are released with the engine.
plugins:
  enabled: false
  replicas: 1
  image:
    repository: ghcr.io/nightbaker/fleans-plugins
    tag: ""
  # Extra env for the plugin host only. The Camunda plugin needs
  # ConnectionStrings__camunda-external-tasks: with postgres.enabled the chart sets it to a
  # camunda_external_tasks database on the bundled server; otherwise set it here, e.g.
  # - name: ConnectionStrings__camunda-external-tasks
  #   valueFrom: { secretKeyRef: { name: camunda-db, key: connection-string } }
  env: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Blazor Server admin UI.
web:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# MCP server (for AI agent integration).
mcp:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  service:
    type: ClusterIP
    port: 5200
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Ingress (optional, for exposing the Web UI publicly)
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: fleans.example.com
  tls:
    enabled: false
    secretName: ""

# -----------------------------------------------------------------------------
# Persistence — choose Sqlite (in-pod, ephemeral) or Postgres
# -----------------------------------------------------------------------------
persistence:
  # Sqlite | Postgres (case-insensitive; other values abort `helm template`)
  # NOTE: Sqlite is for local-dev parity with `dotnet run --project Fleans.Aspire`
  # and is NOT supported by this chart out of the box. To run with Sqlite you
  # must add a writable volume (PVC or emptyDir, single-replica only) and set
  # FLEANS_SQLITE_CONNECTION + FLEANS_QUERY_CONNECTION via `extraEnv`. Postgres
  # is the recommended production path.
  provider: Postgres

# Postgres dependency. When postgres.enabled=true the chart provisions an
# in-cluster StatefulSet. When false, set persistence.provider=Postgres and
# supply external connection strings via env (extraEnv on each workload) or
# bake them into a values overlay.
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  database: fleans
  username: fleans
  # Empty = chart generates a random password into a Secret on first install.
  # Set explicitly for reproducible installs (e.g. GitOps).
  password: ""
  # Set to reference an existing Secret with key `postgres-password`. If set,
  # `password` above is ignored.
  existingSecret: ""
  service:
    port: 5432
  persistentVolume:
    enabled: true
    size: 8Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -----------------------------------------------------------------------------
# Reminders — every pending BPMN timer is one Orleans reminder.
# -----------------------------------------------------------------------------
reminders:
  # Redis | Postgres (case-insensitive).
  # Redis (default) reuses the chart-bundled Redis: fine for small and medium timer counts, but
  # it keeps every reminder of the cluster in one Redis key.
  # Postgres is the recommended production provider at scale (millions of pending timers);
  # requires persistence.provider=Postgres. Plugin hosts (plugins.*, your own) must use
  # the same provider — every silo serves a slice of the reminder ring.
  provider: Redis
  postgres:
    # Existing Secret holding the connection string of a DEDICATED reminders database
    # (ConnectionStrings__fleans-reminders), so the reminders' periodic range reads do not
    # compete with the journal and read model. Empty = share the `fleans` database.
    existingSecret: ""
    existingSecretKey: connection-string

# -----------------------------------------------------------------------------
# Clustering — the Orleans membership table that decides which silo is alive.
# -----------------------------------------------------------------------------
clustering:
  # Redis | Postgres (case-insensitive) — Fleans:Clustering:Provider, set on every silo AND on
  # web/mcp (their gateway list is the same table). Redis (default) reuses the chart-bundled
  # Redis; its replication is asynchronous, so a failover can drop a membership write.
  # Postgres is the recommended production provider; requires persistence.provider=Postgres.
  # Plugin hosts (plugins.*, your own) must use the same provider.
  provider: Redis
  postgres:
    # Existing Secret holding the connection string of a DEDICATED membership database
    # (ConnectionStrings__fleans-cluster). Empty = share the `fleans` database.
    existingSecret: ""
    existingSecretKey: connection-string
  # Orleans ServiceId / ClusterId (Orleans__ServiceId / Orleans__ClusterId on every workload, and
  # the orleans/serviceId + orleans/clusterId labels on silo pods). clusterId empty = release fullname.
  serviceId: fleans
  clusterId: ""
  kubernetes:
    # Orleans Kubernetes hosting (Fleans:Kubernetes:Enabled): the pod name becomes the silo name
    # and a silo whose pod is deleted leaves the membership table at once instead of after the
    # probe window. Creates a ServiceAccount + Role (pods: get, list, watch, patch) + RoleBinding.
    enabled: true
  # Seconds between SIGTERM and SIGKILL for silo pods. The silo's graceful stop (leave the
  # cluster, hand off grains and its reminder range) gets this minus 10 s. Minimum 15.
  terminationGracePeriodSeconds: 60

# -----------------------------------------------------------------------------
# Load shedding — Orleans rejects new client requests on a silo whose CPU is above
# the threshold (the REST API answers 503) instead of queueing them. Set on the core
# and worker silos (Fleans:LoadShedding:*). Calls inside the cluster are not shed, so
# it acts on requests that reach a silo through its gateway: from api.*, web and mcp.
# -----------------------------------------------------------------------------
loadShedding:
  enabled: false
  # Silo CPU percentage (1–100) at which shedding starts.
  cpuThreshold: 95

# -----------------------------------------------------------------------------
# Redis dependency — needed while clustering, reminders or streaming is Redis (the
# defaults). With clustering.provider=Postgres, reminders.provider=Postgres and
# streaming.provider=Kafka|AzureQueue no workload uses it: set redis.enabled=false
# and the hosts register no Redis client or Redis health check.
# -----------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  service:
    port: 6379
  persistentVolume:
    enabled: false
    size: 1Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# -----------------------------------------------------------------------------
# Authentication (OIDC for the Web admin UI)
# -----------------------------------------------------------------------------
# Leave authority + clientId empty to disable auth (matches Fleans.Web's
# auth-disabled fallback). Provide all three to enable.
auth:
  authority: ""
  clientId: ""
  # Reference an existing Secret with key `client-secret` instead of inlining.
  clientSecretExistingSecret: ""
  # Or inline (NOT recommended for production — use existingSecret).
  clientSecret: ""

# -----------------------------------------------------------------------------
# Streaming (Orleans Streams; defaults to Redis to match the engine default and
# reuse the chart-bundled Redis instance).
# -----------------------------------------------------------------------------
streaming:
  # Memory | Redis | Kafka | AzureQueue (case-insensitive)
  # WARNING: Memory is single-silo debug-only — DO NOT use in multi-silo deployments.
  provider: Redis
  redis:
    # Orleans stream parallelism — pulling-agent count per cluster.
    # Default 8 matches the engine default in FleanStreamingExtensions.ReadRedisTotalQueueCount.
    totalQueueCount: 8
  kafka:
    # Comma-separated brokers list, e.g. "kafka.kafka.svc:9092"
    brokers: ""
    # Orleans stream parallelism — pulling-agent count per cluster.
    # Default 8 matches the engine default in KafkaStreamingOptions.QueueCount.
    queueCount: 8
    # Broker authentication and encryption. Leave protocol empty for plaintext brokers.
    # Reference: https://nightbaker.github.io/fleans/reference/streaming/#kafka-security-sasl--tls
    security:
      # Plaintext | Ssl | SaslPlaintext | SaslSsl
      protocol: ""
      # Plain | ScramSha256 | ScramSha512 — required with SaslPlaintext / SaslSsl.
      saslMechanism: ""
      saslUsername: ""
      # Existing Secret holding the SASL password.
      saslPasswordSecret: ""
      saslPasswordSecretKey: password
      # Existing Secret with PEM files, mounted read-only at /etc/fleans/kafka on every Fleans
      # pod (requires protocol Ssl or SaslSsl). ca.crt is the CA that signed the broker
      # certificate; with clientCertificate=true, tls.crt + tls.key are presented to the broker
      # (mutual TLS). A cert-manager Certificate Secret has this layout.
      tlsSecret: ""
      clientCertificate: false
  azureQueue:
    # Azurite or Azure Storage account connection string.
    # Inline value here for simplicity; for production use the existingSecret
    # pattern (follow-up tracked separately).
    connectionString: ""

# -----------------------------------------------------------------------------
# Common pod settings
# -----------------------------------------------------------------------------
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Add custom env vars to ALL fleans workloads (api/web/mcp). Use this for
# Postgres connection-string overrides when postgres.enabled=false.
extraEnv: []
# - name: ConnectionStrings__fleans
#   value: "Host=my-external-pg;Port=5432;Database=fleans;Username=fleans;Password=..."
