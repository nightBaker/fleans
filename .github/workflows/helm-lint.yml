name: Helm chart lint

on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/helm-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'charts/**'
      - '.github/workflows/helm-lint.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.14.4
      - name: helm lint
        run: helm lint charts/fleans/
      - name: helm template (default values)
        run: helm template fleans charts/fleans/ > /tmp/render-default.yaml
      - name: helm template (postgres + ingress + auth + worker + kafka)
        run: |
          helm template fleans charts/fleans/ \
            --set ingress.enabled=true \
            --set ingress.host=fleans.test.local \
            --set ingress.tls.enabled=true \
            --set ingress.tls.secretName=fleans-tls \
            --set auth.authority=https://idp.test/realms/fleans \
            --set auth.clientId=fleans-web \
            --set auth.clientSecret=test-secret \
            --set worker.enabled=true \
            --set streaming.provider=Kafka \
            --set streaming.kafka.brokers=kafka:9092 \
            --set reminders.provider=Postgres \
            --set reminders.postgres.existingSecret=fleans-reminders-db \
            --set clustering.provider=Postgres \
            --set clustering.postgres.existingSecret=fleans-cluster-db \
            --set customWorker.enabled=true \
            --set projector.enabled=true \
            > /tmp/render-full.yaml
      - name: helm template (Kubernetes hosting off)
        run: helm template fleans charts/fleans/ --set clustering.kubernetes.enabled=false > /tmp/render-nok8s.yaml
      - name: Confirm renders are non-empty
        run: |
          test -s /tmp/render-default.yaml
          test -s /tmp/render-full.yaml
          test -s /tmp/render-nok8s.yaml
          echo "default render: $(wc -l < /tmp/render-default.yaml) lines"
          echo "full render:    $(wc -l < /tmp/render-full.yaml) lines"
      - name: Clustering wiring (#885)
        run: |
          set -e
          # Kubernetes hosting (default on): RBAC, role-prefixed silo Deployments, Orleans pod labels, downward API.
          grep -q '^kind: Role$' /tmp/render-default.yaml
          grep -q '^kind: RoleBinding$' /tmp/render-default.yaml
          grep -q 'name: core-fleans$' /tmp/render-default.yaml
          grep -q 'orleans/clusterId: "fleans"' /tmp/render-default.yaml
          grep -q 'serviceAccountName: fleans-silo' /tmp/render-default.yaml
          grep -q 'fieldPath: metadata.name' /tmp/render-default.yaml
          grep -q 'terminationGracePeriodSeconds: 60' /tmp/render-default.yaml
          # Every silo Deployment's pod name must start with its role (placement reads the prefix).
          grep -q 'name: worker-fleans$' /tmp/render-full.yaml
          grep -q 'name: worker-fleans-custom$' /tmp/render-full.yaml
          grep -q 'name: projector-fleans$' /tmp/render-full.yaml
          grep -q 'value: "Projector"' /tmp/render-full.yaml
          grep -q 'name: ConnectionStrings__fleans-cluster' /tmp/render-full.yaml
          # Opt-out removes RBAC and the pod-name wiring. (`set -e` ignores `! cmd`, hence the ifs.)
          if grep -qE '^kind: Role$|serviceAccountName:' /tmp/render-nok8s.yaml; then
            echo "clustering.kubernetes.enabled=false still renders RBAC / serviceAccountName"; exit 1
          fi
          # Fail-guards.
          if helm template fleans charts/fleans/ --set clustering.provider=Consul > /dev/null 2>&1; then
            echo "unknown clustering.provider must fail the render"; exit 1
          fi
          if helm template fleans charts/fleans/ --set clustering.provider=Postgres --set persistence.provider=Sqlite > /dev/null 2>&1; then
            echo "clustering.provider=Postgres with persistence.provider=Sqlite must fail the render"; exit 1
          fi
