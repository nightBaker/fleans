# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
defaults:
  run:
    working-directory:  src/Fleans
    
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal --filter "TestCategory!=E2E"

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build E2E project
      run: dotnet build Fleans.E2E.Tests/Fleans.E2E.Tests.csproj
    - name: Install Playwright browsers
      run: |
        # Microsoft.Playwright ships a PowerShell install script; ubuntu-latest has pwsh preinstalled.
        pwsh Fleans.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
    - name: Run E2E tests
      # E2E-Auth specs need the Keycloak topology (FLEANS_E2E_AUTH=true) and run in e2e-auth below.
      run: dotnet test Fleans.E2E.Tests/Fleans.E2E.Tests.csproj --no-build --filter "TestCategory=E2E&TestCategory!=E2E-Auth" --logger "trx;LogFileName=e2e.trx" --results-directory TestResults
    - name: Upload Playwright artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-failure-artifacts
        path: |
          src/Fleans/TestResults/**/*.trx
          src/Fleans/Fleans.E2E.Tests/bin/Debug/net10.0/playwright-traces/

  # Re-runs the E2E-Smoke subset against the non-default providers (#768, #769). The
  # default e2e job above covers Sqlite + Redis streaming; each leg here swaps exactly one
  # provider. AspireFixture passes FLEANS_* through to the AppHost and fails fast if the
  # requested provider's resource (postgres / fleans-kafka / fleans-azurite) isn't provisioned.
  e2e-providers:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: postgres
            env_name: FLEANS_PERSISTENCE_PROVIDER
            env_value: Postgres
          - leg: kafka
            env_name: FLEANS_STREAMING_PROVIDER
            env_value: Kafka
          - leg: azurequeue
            env_name: FLEANS_STREAMING_PROVIDER
            env_value: AzureQueue
    name: e2e-providers (${{ matrix.leg }})
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build E2E project
      run: dotnet build Fleans.E2E.Tests/Fleans.E2E.Tests.csproj
    - name: Install Playwright browsers
      run: pwsh Fleans.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
    - name: Run E2E-Smoke subset
      run: |
        export ${{ matrix.env_name }}=${{ matrix.env_value }}
        dotnet test Fleans.E2E.Tests/Fleans.E2E.Tests.csproj --no-build --filter "TestCategory=E2E-Smoke" --logger "trx;LogFileName=e2e-${{ matrix.leg }}.trx" --results-directory TestResults
    # Silent-green guard (same pattern as pg-tests.yml): a filter that matches nothing
    # exits 0, so require at least one passed test.
    - name: Assert smoke tests actually ran
      if: always()
      run: |
        trx_file=$(find TestResults -name "e2e-${{ matrix.leg }}.trx" | head -1)
        if [ -z "$trx_file" ]; then
          echo "::error::no e2e-${{ matrix.leg }}.trx produced"
          exit 1
        fi
        passed=$(python3 - "$trx_file" <<'PY'
        import sys, xml.etree.ElementTree as ET
        ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
        c = ET.parse(sys.argv[1]).getroot().find(".//t:Counters", ns)
        print(c.get("passed", "0") if c is not None else "0")
        PY
        )
        echo "E2E-Smoke (${{ matrix.leg }}): passed=${passed}"
        if [ "${passed:-0}" -eq 0 ]; then
          echo "::error::Zero E2E-Smoke tests passed on the ${{ matrix.leg }} leg — did the [TestCategory(E2ECategories.Smoke)] tags get dropped?"
          exit 1
        fi
    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-providers-${{ matrix.leg }}-failure-artifacts
        path: |
          src/Fleans/TestResults/**/*.trx
          src/Fleans/Fleans.E2E.Tests/bin/Debug/net10.0/playwright-traces/

  # Authentication leg (#771). FLEANS_E2E_AUTH=true makes the AppHost provision Keycloak with
  # Fleans.Aspire/e2e-auth/fleans-realm.json and wire JWT bearer into Fleans.Api and OIDC into
  # Fleans.Web; AspireFixture fails fast if the keycloak resource is missing. Only E2E-Auth
  # specs run here — the rest of the suite assumes auth is off.
  e2e-auth:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Build E2E project
      run: dotnet build Fleans.E2E.Tests/Fleans.E2E.Tests.csproj
    - name: Install Playwright browsers
      run: pwsh Fleans.E2E.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium
    - name: Run E2E-Auth specs
      env:
        FLEANS_E2E_AUTH: "true"
      run: dotnet test Fleans.E2E.Tests/Fleans.E2E.Tests.csproj --no-build --filter "TestCategory=E2E-Auth" --logger "trx;LogFileName=e2e-auth.trx" --results-directory TestResults
    # Silent-green guard: E2E-Auth specs report Inconclusive (counted as not executed, not
    # failed) when the fixture is not in auth mode, and a filter that matches nothing exits 0 —
    # require total > 0 and passed == total.
    - name: Assert auth specs actually ran
      if: always()
      run: |
        trx_file=$(find TestResults -name "e2e-auth.trx" | head -1)
        if [ -z "$trx_file" ]; then
          echo "::error::no e2e-auth.trx produced"
          exit 1
        fi
        read -r passed total < <(python3 - "$trx_file" <<'PY'
        import sys, xml.etree.ElementTree as ET
        ns = {"t": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
        c = ET.parse(sys.argv[1]).getroot().find(".//t:Counters", ns)
        print(c.get("passed", "0") if c is not None else "0", c.get("total", "0") if c is not None else "0")
        PY
        )
        echo "E2E-Auth: passed=${passed} total=${total}"
        if [ "${total:-0}" -eq 0 ] || [ "${passed:-0}" -ne "${total:-0}" ]; then
          echo "::error::E2E-Auth specs did not all pass against the Keycloak topology (passed=${passed}, total=${total})."
          exit 1
        fi
    - name: Upload artifacts on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-auth-failure-artifacts
        path: |
          src/Fleans/TestResults/**/*.trx
          src/Fleans/Fleans.E2E.Tests/bin/Debug/net10.0/playwright-traces/
