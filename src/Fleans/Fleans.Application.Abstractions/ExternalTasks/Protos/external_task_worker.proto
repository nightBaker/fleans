// The external-task worker protocol: how a worker process (in any language) receives the
// <serviceTask type="..."> tasks of the types the engine routes to external workers
// (Fleans:ExternalTasks:TaskTypes) and reports their outcome. Served by Fleans.Api over gRPC and
// gRPC-Web on its HTTP endpoint; the .NET client is the Fleans.ExternalTasks.Sdk package.
//
//   1. Subscribe opens one long-lived server stream per worker process. Its request announces
//      the task types the worker implements (and their editor schema, for the catalog). The
//      engine streams a TaskAssignment for every task of those types, a TaskCancellation when
//      it stops waiting for one, and a Heartbeat every few seconds.
//   2. The worker runs each task and answers with exactly one CompleteTask or FailTask, quoting
//      the assignment's task_token.
//   3. A task the worker never answers (it disconnected, crashed, or ran past the engine's
//      execution timeout) is delivered again — possibly to another worker. Delivery is
//      at-least-once: key external side effects by activity_instance_id.
syntax = "proto3";

package fleans.externaltasks.v1;

option csharp_namespace = "Fleans.Application.ExternalTasks.Protocol";

service ExternalTaskWorker {
  rpc Subscribe(SubscribeRequest) returns (stream WorkerCommand);
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  rpc FailTask(FailTaskRequest) returns (FailTaskResponse);
}

message SubscribeRequest {
  // Shown in the custom-task catalog; unique per worker process (e.g. "<host>-<pid>").
  string worker_name = 1;
  repeated TaskTypeRegistration task_types = 2;
}

message TaskTypeRegistration {
  // The BPMN <serviceTask type="..."> discriminator.
  string task_type = 1;
  optional string display_name = 2;
  // Absent: the management UI's editor falls back to free-form key/value inputs.
  optional ParameterSchema parameter_schema = 3;
  // Groups the task in the editor's picker. Absent: the default group.
  optional string category = 4;
  // Unset: public, usable in any process.
  TaskVisibility visibility = 5;
  // Process definition keys allowed to use a private task, until the allow-list is first edited
  // through the API or the UI. Must be empty for a public task.
  repeated string allowed_process_keys = 6;
}

enum TaskVisibility {
  TASK_VISIBILITY_PUBLIC = 0;
  TASK_VISIBILITY_PRIVATE = 1;
}

message ParameterSchema {
  repeated ParameterSpec parameters = 1;
}

message ParameterSpec {
  string name = 1;
  optional string display_name = 2;
  ParameterType type = 3;
  bool required = 4;
  optional string description = 5;
  optional string default_value = 6;
  // Required when type is LIST or MAP: the type of each entry.
  optional ParameterType item_type = 7;
}

enum ParameterType {
  PARAMETER_TYPE_STRING = 0;
  PARAMETER_TYPE_INTEGER = 1;
  PARAMETER_TYPE_BOOLEAN = 2;
  PARAMETER_TYPE_EXPRESSION = 3;
  PARAMETER_TYPE_MULTILINE_STRING = 4;
  PARAMETER_TYPE_LIST = 5;
  PARAMETER_TYPE_MAP = 6;
}

message WorkerCommand {
  oneof command {
    TaskAssignment task = 1;
    TaskCancellation cancel = 2;
    Heartbeat heartbeat = 3;
  }
}

message TaskAssignment {
  // Opaque; quote it in CompleteTask / FailTask. Unique per delivery attempt.
  string task_token = 1;
  string task_type = 2;
  string workflow_instance_id = 3;
  string workflow_id = 4;
  optional string process_definition_id = 5;
  // Stable across redeliveries of the same task: the idempotency key for side effects.
  string activity_instance_id = 6;
  string activity_id = 7;
  optional string business_id = 8;
  // JSON object: the task's input mappings, already evaluated by the engine.
  string inputs_json = 9;
  // JSON object: the variables visible to the task.
  string variables_json = 10;
}

// The engine no longer waits for this task (it is shutting down or the task timed out); stop
// working on it. Its outcome, if reported, is ignored.
message TaskCancellation {
  string task_token = 1;
}

message Heartbeat {}

message CompleteTaskRequest {
  string task_token = 1;
  // JSON object: the task's result. The engine evaluates the task's output mappings against
  // it, or merges all of it into the workflow scope when the task has none.
  string result_json = 2;
}

message CompleteTaskResponse {}

message FailTaskRequest {
  string task_token = 1;
  // The BPMN error code: an error boundary event with this errorCode catches the failure.
  string code = 2;
  string message = 3;
}

message FailTaskResponse {}
